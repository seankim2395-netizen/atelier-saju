<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아뜰리에 사주(성수점)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: 폰 폭 단일 컬럼 앱 + 하단 탭. 오방색(목화토금수)을 오행 표기에만 쓰고, 나머지는 먹색·쪽빛으로 절제 */
:root{
  --bg:#ECEEF4; --surface:#FFFFFF; --sunk:#F5F6FA; --ink:#171B2C; --muted:#5C6377; --line:#D8DBE5;
  --accent:#2C3E9E; --accent-ink:#FFFFFF; --accent-soft:#E3E7F7;
  --wood:#2D8A68; --fire:#CF4E3D; --earth:#B3851F; --metal:#7A8396; --water:#23365F;
  --love:#C9476B; --friend:#2D8A68; --work:#2C3E9E; --family:#B3851F;
  --display:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#181C2E; --sunk:#12162A; --ink:#E9EBF3; --muted:#9BA2B7; --line:#2B3148;
  --accent:#93A6FF; --accent-ink:#0F1220; --accent-soft:#242C52;
  --wood:#4FBA8F; --fire:#F07B69; --earth:#DCAB40; --metal:#AAB2C3; --water:#83A0E0;
  --love:#F07C9C; --friend:#4FBA8F; --work:#93A6FF; --family:#DCAB40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#181C2E; --sunk:#12162A; --ink:#E9EBF3; --muted:#9BA2B7; --line:#2B3148;
  --accent:#93A6FF; --accent-ink:#0F1220; --accent-soft:#242C52;
  --wood:#4FBA8F; --fire:#F07B69; --earth:#DCAB40; --metal:#AAB2C3; --water:#83A0E0;
  --love:#F07C9C; --friend:#4FBA8F; --work:#93A6FF; --family:#DCAB40; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-size:22px;font-weight:700}
h2{font-family:var(--display);font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.quiet{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.price{font-variant-numeric:tabular-nums}
/* 원국 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pillar{background:var(--sunk);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:4px}
.pillar .lbl{font-size:11px;color:var(--muted)}
.gz{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.2}
.gz small{display:block;font-family:var(--body);font-size:11px;font-weight:500}
.pillar.day{outline:2px solid var(--accent);outline-offset:-2px}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}
.unk{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:99px}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.locked{position:relative}
.locked .blurred{filter:blur(6px);pointer-events:none;user-select:none}
.lockpane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:16px}
/* 폼 */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.q{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.opt{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 0;font-size:13px;color:var(--muted)}
.opt.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
/* 궁합 */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;color:var(--ink);width:100%}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:15px}
.score{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.score small{font-size:12px;font-family:var(--body);color:var(--muted);font-weight:500}
.cat-love{background:var(--love)}.cat-friend{background:var(--friend)}.cat-work{background:var(--work)}.cat-family{background:var(--family)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;color:#fff}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.title-badge{font-family:var(--display);font-size:18px;font-weight:700;color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--sunk);border-radius:12px;padding:10px;text-align:center}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
ul.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.cmp{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;font-size:13px}
.cmp .track{position:relative;height:10px}
.dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
[hidden]{display:none!important}
.mapwrap{overflow-x:auto;background:radial-gradient(circle at 50% 50%,var(--accent-soft),transparent 70%);border-radius:16px;padding-block:6px}
.distkey{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.scalebar{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--line));display:block}
.node text{pointer-events:none}
@media (prefers-reduced-motion:no-preference){.node{animation:pop .45s ease-out both}@keyframes pop{from{opacity:.2;transform:scale(.85)}to{opacity:1;transform:none}}.node{transform-box:fill-box;transform-origin:center}
.core{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{50%{transform:scale(1.06)}}}
svg text{font-family:var(--body)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.medal{font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px;text-align:center}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0}
.linkbox button{flex:none;width:auto}
.invite{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:4px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none;padding:6px 12px;font-size:13px}
.sec{display:flex;flex-direction:column;gap:12px;line-height:1.8}
.sec>p{font-size:15px}
.li{display:grid;grid-template-columns:68px 1fr;gap:8px;font-size:14px;padding-block:8px;border-top:1px solid var(--line)}
.li b{color:var(--accent);font-size:13px}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.tg div{background:var(--sunk);border-radius:10px;padding:6px 0;font-size:12px}
.tg b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sh{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em;padding-top:10px;border-top:1px solid var(--line)}
.sec>.sh:first-child{border-top:0;padding-top:0;margin-top:0}
.hook{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hook b{font-family:var(--display);font-size:16px}
.eyebrow{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.note{font-size:12px;color:var(--muted)}
.pillar .ten{font-size:10.5px;color:var(--muted);line-height:1.2}
.pillar .stage{font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 0}
.warn{font-size:12px;color:var(--fire);background:color-mix(in srgb,var(--fire) 8%,transparent);border-radius:8px;padding:6px 10px;margin:0}
.daeun{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.du{flex:none;width:52px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.du b{font-family:var(--display);font-size:20px;line-height:1.15}
.du .age{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.du .ten{font-size:10.5px;color:var(--muted)}
.du.now{border:2px solid var(--accent);background:var(--accent-soft)}
.nowtag{position:absolute;top:-8px;font-size:9.5px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{display:flex;align-items:center;gap:4px;padding:7px 14px;font-size:13.5px;cursor:pointer;background:var(--sunk)}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.ymd{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
input[type=number],select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.adv summary{cursor:pointer;font-size:13px;color:var(--accent);padding-block:4px}
.adv{display:flex;flex-direction:column;gap:6px}
.meter{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--line) 45%,var(--line) 55%,var(--fire));opacity:.9}
.meter .mfill{position:absolute;inset:0 auto 0 0;border-right:3px solid var(--ink);border-radius:99px}
.meter span{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.mcap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mcap b{color:var(--ink);font-size:13px}
.tblwrap{overflow-x:auto}
table.hid{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
table.hid th,table.hid td{border:1px solid var(--line);padding:6px 4px}
table.hid thead th{background:var(--sunk);font-weight:600}
table.hid tbody th{color:var(--muted);font-weight:500;white-space:nowrap}
table.hid td small{display:block;font-size:10px;color:var(--muted)}
.talk{display:flow-root;background:var(--sunk);border:1px solid var(--line);border-radius:16px;padding:14px}
.seal{float:left;margin:2px 12px 6px 0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fire);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 35%,transparent)}
.talkbody{display:block;min-width:0;font-size:15px;line-height:1.85}
.talkbody p{margin:0 0 10px}.talkbody p:last-child{margin-bottom:0}.talkbody p:first-of-type{font-family:var(--display);font-weight:500}
.advice{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
.adv-col{border-radius:14px;padding:14px;border:1px solid var(--line)}
.adv-col h4{margin:0 0 8px;font-family:var(--display);font-size:15px}
.adv-col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.75;font-size:14.5px}
.warn-col{background:color-mix(in srgb,var(--fire) 7%,var(--surface))}.warn-col h4{color:var(--fire)}
.todo-col{background:color-mix(in srgb,var(--wood) 8%,var(--surface))}.todo-col h4{color:var(--wood)}
.closing{font-family:var(--display);font-weight:500;text-align:center;padding:10px 6px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);color:var(--ink)}
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:230px;padding:18px 18px 0;display:grid;grid-template-columns:1fr;color:#F3F1FF;
 background:radial-gradient(120% 90% at 85% 10%,#3B3F9E 0,transparent 55%),radial-gradient(90% 70% at 0% 100%,#5A2E6E 0,transparent 60%),linear-gradient(160deg,#1A1D4A,#11132E);
 box-shadow:0 18px 40px -18px rgba(20,22,60,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 32% 8%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 58% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 6%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 90% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 46% 36%,#fff 50%,transparent 51%);opacity:.7}
.hero-txt{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;max-width:62%}
.hero-txt h1{color:#fff;font-size:24px}
.eyebrow-l{font-size:11px;letter-spacing:.14em;color:#C9C3FF;font-weight:600}
.bubble{position:relative;background:#fff;color:#2A2350;border-radius:14px;padding:9px 12px;font-family:var(--display);font-size:13.5px;line-height:1.55;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-top:4px}
.bubble::after{content:'';position:absolute;right:-7px;bottom:12px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.hero-art{position:relative;height:150px;margin-top:-6px}
.hero-halmi{position:absolute;left:-6px;bottom:-4px;width:132px;height:132px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));z-index:2}
.orb3d{position:absolute;right:-6px;bottom:6px;width:190px;height:190px;z-index:3}
.orb3d canvas{display:block;width:100%!important;height:100%!important}
.orb-fallback{border-radius:50%;width:120px;height:120px;right:24px;bottom:34px;background:radial-gradient(circle at 35% 30%,#fff 0,#cfd8ff 18%,#7c8cff 55%,#3a3f9a 100%);box-shadow:0 0 40px #7c8cff88}
.cloth{position:absolute;left:30%;right:-20px;bottom:0;height:34px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,#8B2E3F,#5E1C2A);box-shadow:inset 0 3px 0 rgba(255,255,255,.15);z-index:1}
@media (min-width:420px){.hero-txt{max-width:58%}}
.halmi{display:block}
.talk-ava{float:left;margin:0 12px 6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.talk-ava .halmi{width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.talk-ava span{font-size:10.5px;font-weight:700;color:var(--fire);letter-spacing:.08em}
.talk{position:relative;background:linear-gradient(180deg,var(--surface),var(--sunk));box-shadow:0 1px 0 var(--line),0 10px 24px -16px rgba(30,30,80,.35)}
.invite-hm{position:relative;padding-right:84px}
.inv-halmi{position:absolute;right:10px;top:10px;width:66px;height:66px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.ball{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 38%),var(--c);box-shadow:inset -2px -2px 3px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.2)}
.chip.on .ball{box-shadow:inset -2px -2px 3px rgba(0,0,0,.3),0 0 0 1.5px rgba(255,255,255,.7)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 12px 28px -20px rgba(25,30,80,.35)}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 10px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.quiet,.btn.ghost{box-shadow:0 3px 0 var(--line)}
.pillar{background:linear-gradient(160deg,var(--surface),var(--sunk));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 12px -8px rgba(20,25,70,.45),0 2px 0 var(--line);transform:perspective(500px) rotateX(4deg);transition:transform .2s}

.gz{text-shadow:0 2px 0 color-mix(in srgb,currentColor 18%,transparent)}
.fill{background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%)!important;background-color:var(--accent)}
.track{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.du{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 8px -6px rgba(20,25,70,.4)}
.lockpane{backdrop-filter:blur(2px);background:color-mix(in srgb,var(--surface) 62%,transparent)}

  for (const yy of [y - 1, y, y + 1]) for (const [lon, name, zhi] of JIE) ev.push({ utc: solarTermUtc(yy, lon), name, zhi, lon });
  return ev.sort((a, b) => a.utc - b.utc);
}

/* ---------- 균시차 (분) ---------- */
function equationOfTime(utcMs) {
  const jd = utcMs / DAY + UNIX_JD, T = (jd - J2000) / 36525;
  const L0 = rad(280.46646 + 36000.76983*T), M = rad(357.52911 + 35999.05029*T), e = 0.016708634 - 0.000042037*T;
  const eps = rad(23.439291 - 0.0130042*T), y = Math.tan(eps/2) ** 2;
  const E = y*Math.sin(2*L0) - 2*e*Math.sin(M) + 4*e*y*Math.sin(M)*Math.cos(2*L0) - 0.5*y*y*Math.sin(4*L0) - 1.25*e*e*Math.sin(2*M);
  return E * 180 / Math.PI * 4;
}

const HIDDEN = [[9],[5,9,7],[0,2,4],[1],[4,1,9],[2,6,4],[3,5],[5,3,1],[6,8,4],[7],[4,7,3],[8,0]]; // 지장간(정기 먼저)

const P = s => [...s].map(c => ZHI.indexOf(c));

const SANHE_GRP = b => [8,0,4].includes(b) ? 4 : [2,6,10].includes(b) ? 1 : [5,9,1].includes(b) ? 3 : 0; // 수,화,금,목 국

function kongmang(ds, db) { const st = mod(db - ds, 12); return [mod(st - 2, 12), mod(st - 1, 12)]; }
function shinsal(p) {

  at([...TIANYI[D.s], ...TIANYI[Y.s]], '천을귀인', '어려울 때 돕는 사람이 나타나는 가장 큰 길신');

}

/* ---------- 합·충·형·파·해 ---------- */
const STEM_HAP = [[0,5,'토'],[1,6,'금'],[2,7,'수'],[3,8,'목'],[4,9,'화']];

const PA = [[0,9],[1,4],[2,11],[3,6],[5,8],[7,10]];
const HAE = [[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];
const HYEONG = [[[2,5,8],'인사신 삼형(지세지형)'],[[1,10,7],'축술미 삼형(무은지형)'],[[0,3],'자묘 상형(무례지형)']];
function relations(p) {
  const names = ['시', '일', '월', '년'];
  const L = p.map((q, i) => q && { n: names[i], ...q }).filter(Boolean);
  const out = []; const pair = (a, b) => `${a.n}-${b.n}`;
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    for (const [x, y, e] of STEM_HAP) if ((a.s === x && b.s === y) || (a.s === y && b.s === x)) out.push({ type: '천간합', at: pair(a, b), text: `${GAN[a.s]}${GAN[b.s]}합${e}` });
    for (const [x, y] of STEM_CHUNG) if ((a.s === x && b.s === y) || (a.s === y && b.s === x)) out.push({ type: '천간충', at: pair(a, b), text: `${GAN[a.s]}${GAN[b.s]}충` });
    for (const [x, y, e] of YUKHAP) if ((a.b === x && b.b === y) || (a.b === y && b.b === x)) out.push({ type: '육합', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}합${e}` });
    if (mod(a.b - b.b, 12) === 6) out.push({ type: '충', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}충` });
    for (const [x, y] of PA) if ((a.b === x && b.b === y) || (a.b === y && b.b === x)) out.push({ type: '파', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}파` });
    for (const [x, y] of HAE) if ((a.b === x && b.b === y) || (a.b === y && b.b === x)) out.push({ type: '해', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}해` });
    if (WONJIN[a.b] === b.b) out.push({ type: '원진', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}원진` });
    if (a.b === b.b && [4, 6, 9, 11].includes(a.b)) out.push({ type: '자형', at: pair(a, b), text: `${ZHI[a.b]}${ZHI[b.b]}자형` });
  }
  const bs = L.map(q => q.b);
  for (const [g, e] of SAMHAP) { const c = g.filter(x => bs.includes(x)).length; if (c === 3) out.push({ type: '삼합', at: '', text: g.map(x => ZHI[x]).join('') + `삼합 ${e}국` }); else if (c === 2 && bs.includes(g[1])) out.push({ type: '반합', at: '', text: g.filter(x => bs.includes(x)).map(x => ZHI[x]).join('') + `반합 ${e}` }); }
  for (const [g, name] of HYEONG) { const c = g.filter(x => bs.includes(x)).length; if (c >= 2 && (g.length === 2 || c >= 2)) out.push({ type: '형', at: '', text: (c === g.length ? '' : '일부 ') + name }); }
  return out;
}

/* ---------- 신강·신약, 용신 (억부·조후, 참고용) ---------- */
// 가중치: 월지 30, 일지 15, 시지 15, 년지 10, 천간 각 10 (일간 제외) = 100
function strength(p) {
  const [H, D, M, Y] = p, d = GAN_EL[D.s];
  const items = [[M.b, 'b', 30], [D.b, 'b', 15], [Y.b, 'b', 10], [Y.s, 's', 10], [M.s, 's', 10]];
  if (H) items.push([H.b, 'b', 15], [H.s, 's', 10]);
  let tot = 0, sup = 0;
  for (const [v, k, w] of items) { const e = k === 's' ? GAN_EL[v] : ZHI_EL[v]; tot += w; if (e === d || e === mod(d - 1, 5)) sup += w; }
  const score = Math.round(sup / tot * 100);
  const label = score >= 75 ? '극신강' : score >= 55 ? '신강' : score >= 45 ? '중화' : score >= 25 ? '신약' : '극신약';
  return { score, label };
}
function elementCount(p) { const c = [0,0,0,0,0]; for (const q of p) if (q) { c[GAN_EL[q.s]]++; c[ZHI_EL[q.b]]++; } return c; }
function yongsin(p, st, cnt) {
  const d = GAN_EL[p[1].s], M = p[2].b; const tg = e => mod(e - d, 5); // 0비겁 1식상 2재성 3관성 4인성
  const byTg = [0,0,0,0,0]; cnt.forEach((c, e) => byTg[tg(e)] += c);
  let el, why;
  if (st.score >= 55) {
    if (byTg[0] >= byTg[4]) { el = mod(d + 3, 5); why = '비겁이 강해 관성으로 다스림'; }
    else { el = mod(d + 2, 5); why = '인성이 강해 재성으로 조절'; }
    if (byTg[1] === 0 && byTg[2] === 0 && byTg[3] === 0) { el = mod(d + 1, 5); why = '기운을 설기할 식상이 필요'; }
  } else if (st.score < 45) {
    if (byTg[3] >= byTg[2] && byTg[3] >= byTg[1]) { el = mod(d + 4, 5); why = '관성이 강해 인성으로 살인상생'; }
    else if (byTg[2] >= byTg[1]) { el = d; why = '재성이 강해 비겁으로 감당'; }
    else { el = mod(d + 4, 5); why = '식상이 강해 인성으로 제어'; }
  } else { el = cnt.indexOf(Math.min(...cnt)); why = '중화에 가까워 부족한 오행을 보충'; }
  let johu = null;
  if ([5, 6, 7].includes(M) && cnt[1] >= 3) johu = { el: 4, why: '여름생에 화가 많아 수로 식혀야 함' };
  if ([11, 0, 1].includes(M) && cnt[4] >= 3) johu = { el: 1, why: '겨울생에 수가 많아 화로 데워야 함' };
  return { el, why, johu, method: '억부법 + 조후 보정 (참고용)' };
}

/* ---------- 메인 ---------- */
/**
 * @param {object} o
 *  calendar: 'solar'|'lunar', year, month, day, leap(bool, 음력 윤달)
 *  hour, minute: 출생 시각(한국 벽시계). 모르면 null
 *  gender: 'M'|'F'
 *  longitude: 출생지 경도 (기본 서울 126.978)
 *  timeMode: 'lmt'(경도 보정, 기본) | 'apparent'(균시차까지) | 'standard'(보정 없음, 서머타임만 제거)
 *  zishi: 'unified'(23시부터 다음 날 일주, 기본) | 'split'(야자시: 23~24시는 당일 일주, 시간은 다음 날 자시)
 */
function calc(o) {
  const notes = [];
  let [y, m, d] = [o.year, o.month, o.day];
  if(![y,m,d].every(Number.isInteger)||y<1900||y>2050)throw new Error('생년월일은 1900~2050년의 정수로 입력해 주세요.');
  if(o.hour!=null&&(!Number.isInteger(o.hour)||o.hour<0||o.hour>23||!Number.isInteger(o.minute??0)||(o.minute??0)<0||(o.minute??0)>59))throw new Error('출생 시간은 0~23시, 분은 0~59분으로 입력해 주세요.');
  if(o.timeMode&&!['lmt','apparent','standard','fixed'].includes(o.timeMode))throw new Error('시간 보정 방식이 올바르지 않습니다.');
  if(o.zishi&&!['unified','split'].includes(o.zishi))throw new Error('자시 기준이 올바르지 않습니다.');
  if(o.longitude!=null&&(!Number.isFinite(o.longitude)||Math.abs(o.longitude)>180))throw new Error('출생지 경도가 올바르지 않습니다.');
  if(o.timeMode==='fixed'&&(!Number.isFinite(o.fixedOffset??540)||Math.abs(o.fixedOffset??540)>840))throw new Error('고정 시간대가 올바르지 않습니다.');
  if (o.calendar === 'lunar') { [y, m, d] = lunarToSolar(o.year, o.month, o.day, o.leap); notes.push(`음력 ${o.year}.${o.month}.${o.day}${o.leap ? '(윤)' : ''} → 양력 ${y}.${m}.${d}`); }
  solarToLunar(y,m,d); // strict civil-date validation before Date.UTC can normalize invalid days
  const timeKnown = o.hour != null;
  const hh = timeKnown ? o.hour : 12, mm = timeKnown ? (o.minute || 0) : 0;
  const fixed = o.timeMode === 'fixed', fo = o.fixedOffset ?? 540; // 'fixed': 검증용(고정 시간대, 보정 없음)
  const w = fixed ? { utc: Date.UTC(y, m - 1, d, hh, mm) - fo * 60000, notes: [] } : krWallToUtc(y, m, d, hh, mm, o.dstFold); notes.push(...w.notes);
  const utc = w.utc, off = fixed ? fo : krOffsetAt(utc), std = fixed ? fo : krStdOffsetAt(utc);
  if (timeKnown && off !== std) notes.push('서머타임 시행 기간 출생이라 1시간을 보정했습니다.');
  const lon = o.longitude ?? 126.978, mode = o.timeMode || 'lmt';
  let localMin = mode === 'standard' || fixed ? std : lon * 4;
  let eot = 0; if (mode === 'apparent') { eot = equationOfTime(utc); localMin += eot; }
  const local = new Date(utc + localMin * 60000);
  const L = { y: local.getUTCFullYear(), m: local.getUTCMonth() + 1, d: local.getUTCDate(), h: local.getUTCHours(), mi: local.getUTCMinutes() };
  const corrMin = Math.round(localMin - off);
  // 년주·월주: 절입 순간 비교
  const ev = jieAround(y); let cur = null, next = null, prev = null;
  for (let i = 0; i < ev.length; i++) { if (ev[i].utc <= utc) { cur = ev[i]; prev = ev[i]; } else { next = ev[i]; break; } }
  const lichun = solarTermUtc(y, 315), sajuYear = utc >= lichun ? y : y - 1;
  const Y = gz(mod(sajuYear - 4, 60));
  const mb = cur.zhi, M = { s: mod(MONTH_STEM_START[Y.s] + mod(mb - 2, 12), 10), b: mb };
  // 일주·시주: 보정된 지방시
  let dayShift = 0, hourStemDay = 0;
  const minOfDay = L.h * 60 + L.mi;
  if (timeKnown && minOfDay >= 23 * 60) { if ((o.zishi || 'unified') === 'unified') dayShift = 1; else hourStemDay = 1; }
  const dIdx = mod(dayGzIndex(L.y, L.m, L.d) + dayShift, 60), D = gz(dIdx);
  let H = null;
  if (timeKnown) { const hb = Math.floor(mod(minOfDay + 60, 1440) / 120); const baseS = gz(mod(dIdx + hourStemDay, 60)).s; H = { s: mod(HOUR_STEM_START[baseS] + hb, 10), b: hb }; }
  if (timeKnown) { const edge = [60,180,300,420,540,660,780,900,1020,1140,1260,1380].some(b => Math.abs(minOfDay - b) <= 10); if (edge) notes.push('보정 시각이 시(時) 경계 10분 이내입니다. 출생 시각이 조금만 달라도 시주가 바뀔 수 있습니다.'); }
  if (next && next.utc - utc < 6 * 3600000 || utc - cur.utc < 6 * 3600000) notes.push(`절입(${utc - cur.utc < 6 * 3600000 ? cur.name : next.name}) 시각 6시간 이내 출생입니다. 월주 판단에 출생 시각이 중요합니다.`);
  const sameDayTerms = !timeKnown ? ev.filter(e=>{const t=new Date(e.utc+krOffsetAt(e.utc)*60000);return t.getUTCFullYear()===y&&t.getUTCMonth()+1===m&&t.getUTCDate()===d;}) : [];
  const uncertainty={month:sameDayTerms.length>0,year:sameDayTerms.some(e=>e.lon===315)};
  if (!timeKnown) notes.push('출생 시각을 몰라 시주를 제외했습니다.');
  if(uncertainty.month)notes.push('출생일에 '+sameDayTerms.map(e=>e.name).join('·')+' 절입이 있어 '+(uncertainty.year?'년주·월주':'월주')+'가 출생 시간에 따라 달라집니다. 현재는 정오 가정값이며 확정 결과가 아닙니다.');

 ['태양','세상을 고루 비추는 태양의 기운입니다. 밝고 솔직하며, 어디서든 분위기를 띄우는 중심이 됩니다. 숨기는 것이 없고 감정이 얼굴에 드러나 사람들이 쉽게 마음을 엽니다.','열정, 표현력, 공명정대함. 사람들에게 에너지를 나눠주고, 새로운 일을 시작하는 불씨 역할을 합니다.','쉽게 달아오르고 쉽게 식을 수 있습니다. 마무리까지 열기를 유지하는 것이 과제입니다.','스트레스를 받으면 바로 표출하고 금방 잊습니다. 다만 그 순간의 말이 상대에게 오래 남을 수 있습니다.','크고 분명하게, 감정을 담아 말합니다. 듣는 사람의 속도에 맞추면 설득력이 배가 됩니다.','열정, 표현, 리더십','나의 열정을 받아주고 차분하게 중심을 잡아주는 사람에게 끌립니다.'],
 ['촛불','어둠을 밝히는 등불의 기운입니다. 겉으로는 조용해도 속에 뜨거운 집중력과 따뜻함이 있습니다. 사람의 마음을 세심하게 읽고, 필요한 순간에 정확히 손을 내밉니다.','섬세함, 헌신, 깊은 집중력. 한 사람과 한 가지 일에 깊이 몰입해 남다른 완성도를 만듭니다.','속으로 삭인 감정이 쌓이면 한 번에 터질 수 있습니다. 서운함은 작을 때 말하세요.','스트레스를 받으면 말수가 줄고 생각이 많아집니다. 밤늦게까지 고민하는 습관을 조심하세요.','조용하지만 핵심을 찌르는 말을 합니다. 칭찬과 감사를 자주 표현하면 관계가 더 단단해집니다.','집중, 온기, 통찰','말없이 곁을 지켜주는 사람, 나의 깊은 이야기를 들어주는 사람에게 끌립니다.'],
 ['큰 산','움직이지 않는 큰 산의 기운입니다. 신뢰와 중심을 상징하며, 주변 사람들이 기대는 버팀목이 됩니다. 쉽게 감정을 드러내지 않지만 한번 품은 사람은 끝까지 책임집니다.','듬직함, 포용력, 신용. 위기일수록 존재감이 커지고, 갈등을 중재하는 능력이 있습니다.','변화에 느리고 결정을 미루는 경향이 있습니다. 고집이 고립으로 이어지지 않게 주의하세요.','스트레스를 받으면 입을 닫고 혼자 버팁니다. 주변에서는 괜찮은 줄 압니다.','말이 무겁고 신중합니다. 생각한 것을 조금 더 자주 말로 꺼내면 오해가 줄어듭니다.','신뢰, 포용, 안정','밝고 활기차서 나를 움직이게 하는 사람에게 끌립니다.'],
 ['논밭','씨앗을 받아 길러내는 기름진 땅의 기운입니다. 실속을 챙기면서도 사람을 키우고 돌보는 데 능합니다. 계산이 빠르지만 정이 많아 손해를 보면서도 챙겨주는 면이 있습니다.','실용성, 세심함, 육성 능력. 사람과 일을 오래 키워 결실을 보고, 살림과 관리에 강합니다.','걱정이 많고 생각이 깊어 스스로를 피곤하게 만들 수 있습니다.','스트레스를 받으면 세세한 것까지 통제하려 합니다. 완벽하지 않아도 괜찮다는 여유가 필요합니다.','상대 상황을 배려하며 차근차근 말합니다. 하고 싶은 말은 한 문장으로 정리해 먼저 꺼내 보세요.','돌봄, 실속, 결실','내가 챙겨주고 싶은 사람에게 끌리는 편입니다. 받는 연습도 필요합니다.'],
 ['바위와 쇠','단단한 원석과 무쇠의 기운입니다. 결단이 빠르고 의리를 중시하며, 한번 맺은 관계는 끝까지 지킵니다. 불의를 보면 참지 못하는 강직함이 있습니다.','결단력, 의리, 실행력. 어려운 결정을 대신 내려주고, 위기에서 해결사 역할을 합니다.','말과 행동이 직선적이라 의도와 달리 상처를 줄 수 있습니다.','스트레스를 받으면 몸을 움직여 풀거나 정면으로 부딪힙니다.','짧고 분명하게 말합니다. 같은 내용도 부드러운 표현을 고르면 적이 줄어듭니다.','결단, 의리, 개혁','나를 부드럽게 다듬어 주는 따뜻한 사람에게 끌립니다.'],
 ['보석','잘 다듬어진 보석의 기운입니다. 감각이 예리하고 기준이 높아, 무엇이든 완성도 있게 마무리합니다. 자기만의 미학과 원칙이 분명합니다.','섬세한 감각, 완성도, 자존감. 디테일에서 차이를 만들고, 품위 있는 태도로 신뢰를 얻습니다.','예민함 때문에 작은 말에도 쉽게 상처받을 수 있습니다.','스트레스를 받으면 겉은 차분해도 속으로 날카로워집니다. 혼자만의 정리 시간이 꼭 필요합니다.','정확하고 세련되게 말합니다. 지적보다 제안의 형태로 말하면 상대가 더 잘 받아들입니다.','완성도, 품격, 감각','나의 가치를 알아보고 빛나게 해주는 사람에게 끌립니다.'],
 ['큰 물','바다와 큰 강의 기운입니다. 시야가 넓고 지혜로우며, 다양한 사람과 정보를 품어 큰 흐름을 만듭니다. 자유를 중시해 틀에 갇히는 것을 싫어합니다.','지혜, 포용력, 기획력. 판 전체를 읽고 방향을 잡으며, 위기에도 유연하게 길을 찾습니다.','생각이 넓게 퍼져 한곳에 머무르기 어려울 수 있습니다.','스트레스를 받으면 여행이나 새로운 일로 떠나 기분을 전환합니다.','유머와 비유를 섞어 넓게 이야기합니다. 결론을 먼저 말하면 전달력이 높아집니다.','지혜, 자유, 확장','나의 자유를 존중하면서도 중심을 잡아주는 사람에게 끌립니다.'],
 ['이슬과 비','대지를 적시는 비와 이슬의 기운입니다. 조용하지만 직관이 날카롭고, 스며들듯 사람을 움직입니다. 상상력이 풍부하고 감수성이 깊습니다.','직관, 인내, 배려. 말없이 상황을 정확히 읽어내고, 필요한 사람에게 필요한 것을 줍니다.','감정을 드러내지 않아 속마음을 오해받기 쉽습니다.','스트레스를 받으면 혼자 숨어 회복합니다. 충분히 쉬면 다시 힘을 냅니다.','조용하고 부드럽게 말합니다. 중요한 순간에는 내 의견을 먼저 꺼내는 용기가 필요합니다.','직관, 감수성, 치유','밝게 나를 이끌어 주는 사람, 함께 있으면 마음이 따뜻해지는 사람에게 끌립니다.']];

 '큰 나무 일간은 연애에서도 책임감이 강하고 한결같습니다. 마음이 정해지면 상대를 지키고 이끌어 주려는 보호자형 연인입니다. 다만 "내가 옳다"는 생각이 강해 다툼이 생기면 쉽게 물러서지 않는 편입니다. 상대는 해결책보다 공감을 원할 때가 많으니, 먼저 들어주고 나중에 의견을 말하는 순서를 지키면 관계가 훨씬 부드러워집니다. 오래 함께할수록 신뢰가 깊어지는 사랑을 합니다.',
 '풀과 덩굴 일간은 상대에게 맞춰 주고 배려하는 다정한 연인입니다. 상대의 작은 변화도 잘 알아채고 분위기를 부드럽게 만드는 능력이 있습니다. 반면 맞춰 주기만 하다 내 마음이 쌓이는 경우가 있으니, 서운한 점은 그때그때 말하는 연습이 필요합니다. 든든하게 기댈 수 있는 상대를 만나면 안정감 속에서 더 빛납니다. 혼자보다 둘일 때 행복을 크게 느끼는 사주입니다.',
 '태양 일간은 사랑에서도 숨김이 없고 뜨겁습니다. 좋아하면 바로 표현하고, 상대를 즐겁게 해주려는 마음이 큽니다. 연애 초반의 설렘이 강한 만큼 익숙해지면 열기가 식는 것처럼 보일 수 있으니, 작은 이벤트와 표현을 꾸준히 이어가는 것이 중요합니다. 감정이 얼굴과 말에 바로 드러나 다툼도 빨리 하고 화해도 빨리 합니다. 차분하게 중심을 잡아주는 상대와 만나면 균형이 잘 맞습니다.',
 '촛불 일간은 한 사람에게 깊이 집중하는 헌신적인 연인입니다. 겉으로는 조용해도 상대를 세심하게 챙기고 기억해 둔 작은 것들로 감동을 줍니다. 다만 서운함을 쌓아 두다 한 번에 표현하는 경향이 있어, 상대가 갑작스럽게 느낄 수 있습니다. 마음속 이야기를 편하게 꺼낼 수 있는 상대를 만나는 것이 연애운의 핵심입니다. 오래 갈수록 깊어지는 사랑을 하는 사주입니다.',
 '큰 산 일간은 믿음직하고 변함없는 연인입니다. 화려한 표현보다 늘 그 자리에 있어 주는 방식으로 사랑을 보여줍니다. 연애를 시작하기까지 시간이 걸리지만, 한번 마음을 정하면 쉽게 흔들리지 않습니다. 상대가 표현이 부족하다고 느낄 수 있으니 "고맙다", "좋다"는 말을 자주 해 주면 관계가 훨씬 따뜻해집니다. 밝고 활동적인 상대와 만나면 서로 부족한 부분을 채워 줍니다.',
 '논밭 일간은 상대를 챙기고 돌보는 데서 사랑을 느끼는 연인입니다. 식사, 건강, 일정까지 세심하게 챙겨 주는 생활형 다정함이 매력입니다. 다만 걱정이 많아 상대의 선택에 간섭하는 것처럼 느껴질 수 있으니 믿고 맡기는 여유도 필요합니다. 받는 것보다 주는 것에 익숙하므로, 나를 아껴 주는 상대를 알아보는 눈을 키우세요. 현실적인 미래를 함께 그리는 관계에서 행복을 느낍니다.',
 '무쇠 일간은 의리 있고 직진하는 연인입니다. 마음에 들면 돌려 말하지 않고 분명하게 표현하며, 한번 맺은 관계는 끝까지 책임집니다. 다만 직설적인 말투가 상대에게 상처가 될 수 있으니 같은 말도 부드럽게 다듬는 연습이 필요합니다. 활동적인 데이트, 함께 도전하는 경험을 통해 관계가 깊어집니다. 따뜻하고 유연한 상대를 만나면 단단함이 든든함으로 바뀝니다.',
 '보석 일간은 연애에서도 기준과 취향이 분명합니다. 대화의 결, 옷차림, 말투처럼 작은 부분에서 호감과 비호감이 갈립니다. 세련되고 배려 깊은 연애를 하지만, 상처를 받으면 겉으로 티를 내지 않고 마음을 닫는 경우가 있습니다. 나의 가치를 알아봐 주고 존중해 주는 상대에게 깊이 마음을 엽니다. 서운함을 말로 표현하는 연습이 관계를 오래 지켜 줍니다.',
 '큰 물 일간은 자유롭고 넓은 마음으로 사랑하는 연인입니다. 상대의 다양한 모습을 받아들이는 포용력이 있고, 함께 새로운 경험을 하는 것을 좋아합니다. 다만 구속받는 느낌을 싫어해 연락이나 일정 문제로 갈등이 생길 수 있습니다. 서로의 시간을 존중하는 규칙을 정해 두면 관계가 편안해집니다. 지적인 대화가 통하는 상대에게 강하게 끌립니다.',
 '이슬과 비 일간은 조용하고 깊게 사랑하는 연인입니다. 상대의 마음을 직관적으로 읽고, 필요한 순간에 말없이 곁을 지켜 줍니다. 감정을 쉽게 드러내지 않아 상대가 내 마음을 확신하지 못할 수 있으니, 가끔은 분명하게 표현해 주세요. 상처를 받으면 혼자 정리하는 시간이 필요한 타입이라, 그 시간을 이해해 주는 상대가 잘 맞습니다. 정서적으로 깊이 연결되는 관계에서 가장 행복합니다.'],
health:[
 '나무의 기운은 위로 뻗는 성질이라, 몸도 늘 긴장 상태로 앞으로 나아가려 합니다. 일에 몰두하면 쉬는 것을 잊고, 그 긴장이 어깨와 목, 눈에 먼저 쌓인다고 봅니다. 화가 나거나 답답할 때 참는 습관이 있다면 몸의 피로로 이어지기 쉽습니다. 하루 중 일정한 시간에 몸을 쭉 펴 주는 스트레칭과 화면에서 눈을 떼는 휴식이 가장 좋은 관리법입니다. 숲길이나 공원처럼 초록이 있는 곳을 걷는 것도 기운을 순하게 만들어 줍니다.',
 '풀과 덩굴의 기운은 유연하지만 바람에 흔들리기 쉬워, 주변 분위기에 따라 컨디션이 오르내린다고 봅니다. 사람을 챙기다 정작 내 몸을 돌보는 일을 미루기 쉽습니다. 긴장이 목과 어깨, 손목 같은 관절 부위에 쌓이지 않게 자주 풀어 주세요. 규칙적인 수면과 가벼운 요가가 잘 맞으며, 혼자만의 회복 시간을 일정에 넣어 두는 것이 중요합니다.',
 '태양의 기운은 열이 많고 활동적이라, 에너지를 한꺼번에 쓰고 갑자기 지치는 패턴이 생기기 쉽다고 봅니다. 늦은 밤까지 활동하거나 카페인에 의존하면 잠이 얕아질 수 있습니다. 땀을 내는 운동으로 열을 풀어 주고, 잠들기 한 시간 전에는 화면을 멀리하는 습관이 도움이 됩니다. 감정을 바로 표현하는 편이라 스트레스가 오래 쌓이지는 않지만, 과로에는 특히 주의가 필요합니다.',
 '촛불의 기운은 안으로 타오르는 성질이라, 겉으로는 괜찮아 보여도 속으로 피로가 쌓이기 쉽다고 봅니다. 생각이 많아 밤에 잠들기 어렵거나 깊이 잠들지 못하는 경우가 있습니다. 하루를 정리하는 짧은 기록이나 명상으로 머릿속을 비워 주면 수면의 질이 좋아집니다. 무리한 일정보다 일정한 리듬을 지키는 것이 컨디션 관리의 핵심입니다.',
 '큰 산의 기운은 무겁고 안정적이라, 기본 체력은 좋지만 몸을 잘 움직이지 않으면 순환이 둔해진다고 봅니다. 스트레스를 받으면 소화가 먼저 반응하는 편이니 식사 시간을 일정하게 지키는 것이 중요합니다. 걷기, 등산처럼 꾸준히 몸을 움직이는 운동이 잘 맞습니다. 참는 성격 탓에 피로를 늦게 알아차리니 정기적으로 컨디션을 점검하는 습관을 들이세요.',
 '논밭의 기운은 습하고 세심해, 걱정이 몸으로 이어지기 쉬운 체질로 봅니다. 신경을 많이 쓰는 날은 식욕이 떨어지거나 속이 더부룩해질 수 있습니다. 규칙적인 식사와 따뜻한 음식이 기본이고, 생각을 멈추게 해 주는 가벼운 운동이나 취미가 도움이 됩니다. 남을 돌보느라 내 몸을 뒤로 미루지 않도록, 나를 위한 휴식 시간을 일정표에 먼저 적어 두세요.',
 '무쇠의 기운은 단단하고 강해 기본 체력이 좋은 편이지만, 무리해도 버티다 한 번에 지치는 패턴이 생기기 쉽다고 봅니다. 건조한 계절에 호흡기와 피부 관리에 신경 쓰는 것이 좋습니다. 몸을 움직여 스트레스를 푸는 타입이라 근력 운동이나 격렬한 운동이 잘 맞지만, 회복 시간도 운동만큼 중요합니다. 실내 환기와 충분한 수분 섭취를 습관으로 만드세요.',
 '보석의 기운은 섬세하고 예민해, 환경 변화에 몸이 민감하게 반응한다고 봅니다. 수면 환경, 공기, 소음 같은 작은 요소가 컨디션을 좌우합니다. 피부와 호흡기 관리에 신경 쓰고, 내게 맞는 생활 환경을 정돈해 두면 컨디션이 안정됩니다. 완벽주의로 인한 긴장이 쌓이지 않도록 "오늘은 이 정도면 충분하다"는 여유를 가지는 것도 관리의 일부입니다.',
 '큰 물의 기운은 늘 흐르고 움직이는 성질이라, 활동 범위가 넓고 일정이 불규칙해지기 쉽다고 봅니다. 몸이 차가워지면 컨디션이 떨어지는 편이니 하체를 따뜻하게 하고 충분히 자는 것이 기본입니다. 수영이나 반신욕처럼 물과 가까운 활동이 회복에 도움이 됩니다. 생각이 넓게 퍼져 쉬는 시간에도 머리가 바쁜 편이라, 일부러 아무것도 하지 않는 시간을 가져 보세요.',
 '이슬과 비의 기운은 조용하고 차분해, 에너지를 아껴 쓰는 대신 회복에도 시간이 필요한 체질로 봅니다. 감정을 안으로 담아 두는 편이라 마음의 피로가 몸의 피로로 이어지기 쉽습니다. 충분한 수면과 따뜻한 차, 혼자만의 조용한 시간이 가장 좋은 보약입니다. 무리하게 사람을 만나는 일정보다 회복할 여유가 있는 일정을 짜는 것이 컨디션을 지키는 방법입니다.'],
people:[
 '큰 나무 일간은 사람들 사이에서 자연스럽게 중심이 되는 사람입니다. 정직하고 책임감이 강해 신뢰를 얻지만, 옳다고 믿는 것을 굽히지 않아 부딪히는 사람도 생깁니다. 나보다 경험이 많은 사람의 조언을 받아들이는 유연함이 생기면 인간관계의 폭이 훨씬 넓어집니다. 후배와 아랫사람에게는 든든한 선배로 기억되며, 그 관계가 나중에 큰 힘이 되어 돌아옵니다.',
 '풀과 덩굴 일간은 어떤 모임에서도 금방 어울리고 사람들을 이어 주는 연결고리입니다. 상대의 기분을 잘 살펴 갈등을 미리 막아 주는 역할을 합니다. 다만 모두에게 좋은 사람이 되려다 정작 내 의견을 숨기게 되는 경우가 있습니다. 나를 있는 그대로 받아 주는 소수의 친구를 곁에 두는 것이 마음의 안정에 큰 도움이 됩니다.',
 '태양 일간은 어디서나 분위기를 밝히는 사교형입니다. 처음 만난 사람과도 금방 친해지고, 주변에 사람이 끊이지 않습니다. 다만 솔직한 말이 의도와 달리 상처가 되는 경우가 있으니 감정이 올라온 순간에는 한 박자 쉬어 가세요. 넓은 인맥 중에서도 깊이 마음을 나누는 관계를 몇 명 만들어 두면 어려울 때 큰 힘이 됩니다.',
 '촛불 일간은 넓기보다 깊은 관계를 맺는 사람입니다. 한번 마음을 준 사람에게는 끝까지 정성을 다해, 오래된 친구가 많은 편입니다. 다만 서운함을 쌓아 두는 경향이 있어 관계가 갑자기 멀어지는 일이 생길 수 있습니다. 작은 서운함을 그때그때 가볍게 이야기하는 습관이 소중한 관계를 지켜 줍니다.',
 '큰 산 일간은 주변 사람들이 믿고 기대는 버팀목입니다. 말수는 적어도 어려운 일이 생기면 가장 먼저 찾는 사람이 됩니다. 다만 표현이 적어 처음에는 다가가기 어렵다는 인상을 줄 수 있습니다. 먼저 안부를 묻는 작은 행동이 관계를 훨씬 따뜻하게 만들어 줍니다.',
 '논밭 일간은 주변 사람을 챙기고 돌보는 살림꾼 같은 존재입니다. 사람의 필요를 빨리 알아채고 도움을 주어 고마움을 사는 일이 많습니다. 다만 주는 만큼 돌아오지 않으면 서운함이 커질 수 있으니, 기대 없이 베풀 수 있는 선을 정해 두세요. 나를 챙겨 주는 사람을 곁에 두는 것도 중요합니다.',
 '무쇠 일간은 의리와 신의를 가장 중요하게 여기는 사람입니다. 내 사람이라고 생각하면 끝까지 지켜 주어 깊은 신뢰를 얻습니다. 다만 옳고 그름이 분명해 맞지 않는 사람과는 선을 긋는 경우가 많습니다. 생각이 다른 사람의 이야기도 끝까지 들어 주는 여유가 생기면 더 큰 사람으로 성장합니다.',
 '보석 일간은 사람을 고르는 기준이 분명하고, 취향이 맞는 사람과 깊이 교류합니다. 예의와 품위를 중시해 첫인상이 좋고 오래 신뢰를 얻습니다. 다만 작은 말이나 행동에 쉽게 상처받아 관계를 정리하는 경우가 있습니다. 상대의 의도를 한 번 더 좋게 해석해 보는 습관이 인간관계를 편안하게 만들어 줍니다.',
 '큰 물 일간은 다양한 사람을 품는 넓은 인맥의 소유자입니다. 분야와 나이를 가리지 않고 교류해 정보와 기회가 많이 모입니다. 다만 관계가 넓은 만큼 깊이가 얕아질 수 있으니, 정말 소중한 사람에게는 시간을 따로 내어 주세요. 넓은 인맥을 연결해 주는 역할을 하면 그 자체로 큰 귀인운이 됩니다.',

 '토 일간은 땅이 물을 머금듯 돈을 지키는 힘이 좋은 사람이야. 쉽게 쓰지 않고, 한번 들어온 건 웬만해선 안 내보내지. 그래서 큰 부자는 몰라도 굶을 걱정은 없는 팔자란다. 다만 너무 꽉 쥐고만 있으면 돈이 썩어. 고민만 하다 좋은 때를 놓치는 일이 많으니, 확실하다 싶으면 한 번은 과감하게 움직여 보거라. 땅이나 집처럼 눈에 보이는 재산과 인연이 좋으니 그쪽으로 공부를 해 두면 좋다.',
 '금 일간은 쇠붙이처럼 돈 계산이 정확한 사람이야. 손해 보는 거래는 귀신같이 알아채지. 그런데 의리에 약해서, 친한 사람이 부탁하면 계산이고 뭐고 다 잊어버려. 보증, 동업, 빌려준 돈, 이 세 가지가 네 재물을 갉아먹는 벌레란다. 원칙을 세우되 사람 앞에서도 그 원칙을 지키거라. 실력으로 버는 팔자라 기술이나 자격을 갖추면 그게 평생 밥줄이 된다.',
 '수 일간은 물처럼 돈이 여기저기서 흘러드는 사람이야. 정보가 빠르고 머리가 잘 돌아가서 남들 모르는 길로 돈을 벌기도 하지. 근데 물은 고이질 않아. 들어온 만큼 어디론가 새어 나가지. 그러니 너는 둑을 쌓아야 해. 돈이 들어오면 일단 가둬 두는 통장 하나, 그게 네 둑이야. 이것저것 손대는 버릇만 줄이면 큰물이 되는 팔자란다.'],
job:['목 일간은 위로 뻗어야 사는 나무야. 승진이든 성장이든 올라갈 길이 보이는 곳에 있어야 신이 나지. 같은 일을 몇 년째 제자리에서 하고 있으면 속이 곪는다. 너는 사람을 키우고 새 길을 여는 일에 맞아. 처음엔 고생스러워도 판을 처음 짜는 자리를 마다하지 말거라. 다만 윗사람과 부딪힐 때 정면으로 들이받으면 가지가 꺾여. 바람 불 땐 잠깐 고개를 숙이는 것도 나무의 지혜란다.',
 '화 일간은 무대에 서야 빛나는 사람이야. 사람들 앞에서 말하고, 알리고, 분위기를 끌어올리는 일에 타고났지. 조용히 서류만 들여다보는 자리에선 시들어 버린다. 시작은 누구보다 화끈한데 마무리가 약한 게 흠이니, 끝을 챙겨 주는 꼼꼼한 사람을 곁에 두거라. 칭찬받을 때 힘이 나는 아이라, 성과가 눈에 보이는 일을 고르는 게 좋다.',
 '토 일간은 어디서든 가운데를 잡아 주는 사람이야. 회사에선 없으면 안 되는 살림꾼이고, 다툼이 나면 중재하는 사람이지. 화려하진 않아도 오래 버티면 결국 높은 자리에 앉는 팔자란다. 대신 변화가 너무 빠른 곳에선 숨이 막혀. 체계가 잡힌 곳에서 차근차근 올라가거라. 그리고 남의 일까지 다 떠안지 말거라, 네 몫만 해도 충분히 인정받는다.',
 '금 일간은 칼같이 일하는 사람이야. 기준이 분명하고 결단이 빨라 위기 때 빛을 보지. 대충 넘어가는 걸 못 참으니 품질, 법, 기술, 돈 관리처럼 정확해야 하는 일이 맞는다. 다만 바른말이 너무 날카로우면 적이 생겨. 같은 말이라도 칼집에 넣었다 꺼내듯 한 번 다듬어서 하거라. 네 실력을 알아주는 윗사람을 만나면 크게 쓰이는 팔자란다.',
 '수 일간은 판 전체를 읽는 사람이야. 남들이 눈앞만 볼 때 너는 저 멀리 흐름을 보지. 기획, 전략, 정보 다루는 일, 사람 많이 만나는 일에 맞는다. 한 우물만 파라는 말은 너한텐 반만 맞아. 여러 경험을 하되 그걸 하나로 꿰는 실 하나는 놓치지 말거라. 실행을 챙겨 줄 사람과 짝을 이루면 생각이 돈이 되고 이름이 된다.'],
love:['목 일간은 사랑도 나무처럼 해. 한번 뿌리내리면 쉽게 안 옮기지. 상대를 지켜 주고 싶어 하고, 같이 커 나가는 관계를 꿈꾸는 아이야. 그런데 "내가 다 알아서 할게" 하는 마음이 지나치면 상대는 숨이 막혀. 사랑은 끌고 가는 게 아니라 나란히 걷는 거란다. 상대 말을 끝까지 들어 주는 것, 그게 너한테 제일 필요한 연애 공부야.',
 '화 일간은 사랑에 불이 확 붙는 아이야. 좋으면 숨기질 못하고 온 동네가 다 알게 하지. 그 뜨거움이 네 매력이란다. 다만 불이 세면 금방 재가 되기도 해. 처음 설렘이 가라앉을 때 마음이 식은 줄 알고 흔들리지 말거라. 그때부터가 진짜 정이 드는 때야. 작은 표현을 꾸준히 이어 가는 게 오래 가는 비결이란다.',
 '토 일간은 사랑도 천천히 쌓아 올리는 아이야. 쉽게 마음을 안 여는데, 한번 열면 끝까지 가지. 표현이 서툴러서 상대가 "날 좋아하긴 하나" 싶을 때가 있을 게다. 마음은 말로 해야 전해진단다. 고맙다, 보고 싶다, 그 한마디를 아끼지 말거라. 밝고 활기찬 사람을 만나면 네 무거운 기운이 가벼워져서 잘 맞는다.',
 '금 일간은 사랑에도 기준이 분명한 아이야. 아닌 건 아니고, 좋은 건 확실히 좋지. 의리 있고 한결같아서 한번 내 사람이다 싶으면 끝까지 책임진다. 다만 말이 곧아서 상대 가슴에 칼처럼 꽂힐 때가 있어. 맞는 말이라도 따뜻하게 감싸서 건네거라. 부드럽게 감싸 주는 사람을 만나면 네 단단함이 든든함으로 바뀐단다.',
 '수 일간은 사랑도 물처럼 깊고 넓게 해. 상대 마음을 잘 읽고 다 품어 주지. 근데 속마음은 잘 안 보여 줘서 상대가 애가 탈 때가 있어. 묶이는 걸 싫어해서 연락 문제로 다투기도 하지. 서로의 시간을 존중하는 약속을 처음부터 해 두면 편하다. 말이 잘 통하는 사람, 같이 얘기하다 밤새우는 사람이 네 짝이란다.'],
health:['목 기운 사람은 늘 긴장을 달고 산다. 할 일이 있으면 쉬는 걸 잊어버리지. 그 긴장이 어깨, 목, 눈으로 먼저 온다고 옛 어른들은 봤어. 하루에 한 번은 기지개를 쭉 펴고, 화면에서 눈을 떼거라. 화나는 걸 참는 버릇도 몸에 쌓이니, 속상한 건 걸으면서라도 털어 내거라. 초록이 있는 곳을 자주 걸으면 기운이 순해진다.',
 '화 기운 사람은 열이 많아 확 달아올랐다 확 지친다. 밤늦게까지 일하고 커피로 버티는 버릇이 있으면 잠이 얕아져. 땀 흘리는 운동으로 열을 빼 주고, 잘 때는 화면을 멀리하거라. 속이 답답할 땐 바로바로 말해서 풀어. 너는 담아 두면 병 되는 체질이야.',
 '토 기운 사람은 마음이 속으로 간다. 걱정이 많으면 밥맛부터 떨어지지. 끼니를 거르지 말고, 따뜻한 걸 제때 먹는 게 최고의 보약이란다. 몸을 너무 안 움직이면 기운이 고이니 하루에 한 번은 꼭 걷거라. 생각이 많은 날은 몸을 쓰는 일로 머리를 비워 주거라.',
 '금 기운 사람은 버티는 힘이 좋아서 아파도 참는다. 그러다 한 번에 무너지는 게 문제야. 건조한 철에는 목과 피부를 아끼고, 방 공기를 자주 바꿔 주거라. 깊게 숨 쉬는 습관이 너한텐 약이란다. 힘들면 힘들다고 말하는 것도 건강 챙기는 일이야.',
 '수 기운 사람은 몸이 차가워지면 기운이 떨어진다. 발과 배를 따뜻하게 하고, 잠을 충분히 자는 게 기본이야. 생각이 쉬지 않아 누워도 머리가 바쁜 아이라, 자기 전에 머리를 비우는 연습을 하거라. 물가를 걷거나 따뜻한 물에 몸을 담그면 금세 회복된다.'],
people:['목 일간은 사람들 사이에서 자연스럽게 기둥이 되는 아이야. 바르고 책임감이 있으니 믿고 따르는 사람이 생기지. 대신 옳다고 믿는 걸 안 굽혀서 부딪히는 사람도 생겨. 다 이기려 하지 말거라. 져 주는 것도 큰 나무의 넉넉함이란다. 후배들 챙겨 두면 나중에 그게 네 숲이 된다.',
 '화 일간은 어디서든 분위기를 띄우는 아이야. 처음 보는 사람하고도 금방 친해지고, 주변에 사람이 끊이질 않지. 근데 솔직한 말이 가끔 화살이 돼. 기분이 올라온 순간엔 말을 한 박자만 늦추거라. 넓은 인맥 중에서도 속 깊은 얘기 나눌 사람 몇은 꼭 지켜 두거라.',
 '토 일간은 사람들이 기대러 오는 언덕 같은 아이야. 말없이 다 들어 주니 고민 상담을 많이 받지. 그런데 너도 사람이라 지칠 때가 있어. 주는 만큼 못 받으면 서운함이 쌓이니, 너를 챙겨 주는 사람도 곁에 두거라. 먼저 안부 한 통 하는 게 네 인복을 두 배로 키운다.',
 '금 일간은 의리 하나로 사람을 사귀는 아이야. 내 사람이다 싶으면 끝까지 지켜 주지. 대신 선을 넘으면 칼같이 끊어 내. 그게 너를 지키는 방법이긴 한데, 가끔은 한 번 더 기회를 주거라. 생각 다른 사람 얘기도 끝까지 들어 주면 네 그릇이 훨씬 커진다.',
 '수 일간은 누구하고도 섞일 줄 아는 아이야. 나이, 분야 안 가리고 사람을 사귀니 정보와 기회가 몰려오지. 다만 넓게 퍼지면 깊이가 얕아져. 정말 소중한 사람한테는 따로 시간을 내거라. 사람과 사람을 이어 주는 역할을 하면 그게 곧 네 귀인 복이 된단다.'],
char:['나무 기운 사람은 바르게 살고 싶은 마음이 커. 거짓말을 못 하고, 억울한 일 보면 못 참지. 그 바른 마음이 너를 지켜 주는 힘이야. 다만 세상이 다 네 마음 같지는 않단다. 사람마다 사정이 있다는 걸 알면 네가 덜 다친다.',
 '불 기운 사람은 감정이 얼굴에 다 쓰여 있어. 기쁘면 웃고 화나면 바로 티가 나지. 그래서 사람들이 너를 편하게 여긴단다. 그 솔직함을 지키되, 화가 났을 땐 하룻밤만 묵혀서 말하거라. 그것만 해도 후회할 일이 반으로 준다.',
 '흙 기운 사람은 속이 깊고 생각이 많아. 남 앞에선 괜찮은 척해도 밤에 혼자 이 생각 저 생각 하지. 걱정은 미리 한다고 줄지 않는단다. 걱정이 올라오면 종이에 적어 두고 덮어 버리거라. 그러면 머리가 한결 가벼워진다.',
 '쇠 기운 사람은 맺고 끊는 게 분명해. 좋고 싫은 게 확실하고, 한번 정하면 잘 안 바꾸지. 그 단단함이 믿음을 주지만, 너무 단단하면 부러진다. 가끔은 "그럴 수도 있지" 하고 넘기는 여유를 가지거라.',
 '물 기운 사람은 생각이 끝이 없어. 한 가지를 보면 열 가지가 떠오르지. 그 머리가 네 재산이란다. 다만 생각만 하다 시간이 가 버리는 일이 많으니, 떠오른 것 중 하나는 꼭 손으로 해 보거라. 해 본 것만 네 것이 된다.'],
total:['네 사주는 기운이 센 편이야. 혼자서도 길을 뚫는 힘이 있지. 그래서 남한테 기대는 걸 싫어하고, 내 방식대로 해야 직성이 풀려. 이런 사주는 힘을 밖으로 써야 복이 들어온다. 일을 벌이고, 사람을 이끌고, 땀을 흘려야 운이 풀리는 거야. 가만히 있으면 그 기운이 속에서 부딪혀서 괜히 성질만 나지.',
 '네 사주는 기운이 여린 편이야. 그렇다고 약하다는 게 아니란다. 혼자 싸우기보다 좋은 사람, 좋은 울타리 안에서 크게 피는 팔자란 뜻이야. 네 곁에 누가 있느냐가 네 운을 정해. 그러니 사람을 잘 고르고, 도움 받는 걸 부끄러워하지 말거라. 받은 만큼 돌려주면 그게 다 네 복으로 돌아온다.',
 '네 사주는 기운이 고르게 퍼져 있어. 어느 한쪽으로 치우치지 않아서 어디 가서도 무난하게 어울리지. 큰 굴곡 없이 사는 복이 있는 대신, 한 방에 치고 나가는 힘은 약할 수 있다. 너는 꾸준함이 무기야. 남들이 지칠 때 계속 걷는 사람이 결국 멀리 가는 법이란다.'],
y27:['정미년엔 네 곁에 사람이 늘어난다. 같이 하자는 사람도 오고, 같은 자리를 노리는 사람도 오지. 봄에는 새 인연이 들어오고, 여름 지나면서 경쟁이 붙는다. 이럴 땐 혼자 앞서 나가기보다 손을 잡는 게 이기는 길이야. 돈 문제만 깔끔하게 하면 사람이 곧 재산이 되는 해란다.',
 '정미년엔 네 안에 있던 재주가 밖으로 터져 나온다. 그동안 머릿속에만 있던 걸 꺼내 놓기 좋은 해야. 글, 말, 기획, 손재주, 뭐든 내놓는 만큼 반응이 온다. 다만 말이 많아지는 만큼 말실수도 생기니 입단속은 해야 한다. 가을쯤엔 내놓은 것들이 결실로 돌아오기 시작할 게다.',
 '정미년엔 돈 냄새가 나는 해다. 일한 만큼 손에 쥐는 게 생기고, 새로운 수입 길도 보이지. 그런데 기회가 많아 보일수록 욕심을 다스려야 해. 여러 판을 동시에 벌이면 하나도 제대로 못 거둔다. 제일 확실한 것 하나에 힘을 모으거라. 연애도 현실적인 얘기가 오가는 해란다.',

function scrMap(){
  const list=S.friends.map((f,i)=>({f,i,c:cp(f)}));
  const net=S.net||{me:'me',depth:{},parent:{},name:{},edges:[],more:0};
  const order=['friend','work','family'],clampS=v=>Math.max(0,Math.min(100,v));
  const shown=list.filter(x=>S.filter==='all'||x.f.cat===S.filter);
  const R0=56,R1=176,rOf=sc=>R0+(100-clampS(sc))/100*(R1-R0);
  const sectorOf=cat=>S.filter==='all'?order.indexOf(cat):0,span=S.filter==='all'?Math.PI*2/3:Math.PI*2;
  const groups={};shown.forEach(x=>{const k=sectorOf(x.f.cat);(groups[k]=groups[k]||[]).push(x);});
  const pos={},pts=[];pos[net.me]={x:0,y:0,a:0,d:0};
  Object.entries(groups).forEach(([k,arr])=>{arr.sort((p,q)=>q.c.score-p.c.score);const n=arr.length,start=-Math.PI/2+k*span;
    arr.forEach((x,m)=>{const a=start+span*(m+1)/(n+1);let r=rOf(x.c.score);for(let t=0;t<30&&pts.some(q=>Math.hypot(q.px-r*Math.cos(a),q.py-r*Math.sin(a))<64);t++)r+=5;const o={x,a,px:r*Math.cos(a),py:r*Math.sin(a)};pts.push(o);pos[x.f.uid]={x:o.px,y:o.py,a,d:1,cat:x.f.cat};});});

function mountOrb(){
  const host=document.getElementById('orb');if(!host)return;
  if(!window.THREE){host.classList.add('orb-fallback');return;}
  try{
    if(!ORB){
      const T=THREE,r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
      const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,50);cam.position.set(0,.9,6.4);cam.lookAt(0,.1,0);
      sc.add(new T.HemisphereLight(0xffffff,0x444444,.9));const key=new T.DirectionalLight(0xffffff,1.2);key.position.set(-3,4,4);sc.add(key);
      const g=new T.Group();sc.add(g);
      const geo=new T.IcosahedronGeometry(.95,5),base=geo.attributes.position.array.slice();
      const es=new T.Scene();es.background=new T.Color(0x9a9a96);
      const pane=(c,w,h,x,y,z,ry,rx)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry||0;m.rotation.x=rx||0;es.add(m);};
      pane(0xffffff,8,3,0,5,0,0,Math.PI/2);pane(0xd8cbb4,3,4,-5,1,0,Math.PI/2);pane(0x9aa0a8,3,3,5,0,1,-Math.PI/2);pane(0xf4f2ee,6,2,0,1,-5);pane(0x1c1c1c,10,10,0,-4,0,0,Math.PI/2);
      const pm=new T.PMREMGenerator(r);const env=pm.fromScene(es,.03).texture;
      const blob=new T.Mesh(geo,new T.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.08,envMap:env,envMapIntensity:1.15}));blob.position.y=.45;g.add(blob);
      const plinth=new T.Mesh(new T.BoxGeometry(1.5,.9,1.5),new T.MeshStandardMaterial({color:0x8f8d88,roughness:.95,metalness:0}));plinth.position.y=-.95;g.add(plinth);
      const tag=new T.Mesh(new T.BoxGeometry(.42,.12,.02),new T.MeshStandardMaterial({color:0xb08d57,metalness:.8,roughness:.35}));tag.position.set(.35,-.8,.76);g.add(tag);
      const lights=[],els=[];['--wood','--fire','--earth','--metal','--water'].forEach((v,i)=>{const L=new T.PointLight(0xffffff,1.1,6);sc.add(L);lights.push(L);
        const m=new T.Mesh(new T.SphereGeometry(.11,24,24),new T.MeshStandardMaterial({color:0xffffff,roughness:.25,metalness:.2,emissive:0x000000}));m.userData={a:i*Math.PI*2/5,v,L};g.add(m);els.push(m);});
      ORB={r,sc,cam,g,els,blob,geo,base,t:0,run:false};
      const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      const tick=()=>{if(!ORB.run)return;ORB.t+=.01;const t=ORB.t,p=ORB.geo.attributes.position.array,b=ORB.base;
        for(let k=0;k<p.length;k+=3){const x=b[k],y=b[k+1],z=b[k+2],n=1+.13*Math.sin(x*3.1+t*1.3)*Math.sin(y*2.7+t)*Math.sin(z*3.3+t*.8);p[k]=x*n;p[k+1]=y*n;p[k+2]=z*n;}
        ORB.geo.attributes.position.needsUpdate=true;ORB.geo.computeVertexNormals();ORB.blob.rotation.y=t*.35;
        ORB.els.forEach(m=>{const a=m.userData.a+t*.9;m.position.set(Math.cos(a)*1.45,.45+Math.sin(a*2)*.25,Math.sin(a)*1.45*.55);m.userData.L.position.copy(m.position).multiplyScalar(1.15);});
        ORB.r.render(ORB.sc,ORB.cam);if(!reduce)requestAnimationFrame(tick);};
      ORB.start=()=>{if(!ORB.run){ORB.run=true;tick();}};
    }
    ORB.els.forEach(m=>{const c=cssVar(m.userData.v)||'#ffffff';m.material.color.set(c);m.material.emissive.set(c);m.material.emissiveIntensity=.35;m.userData.L.color.set(c);});
    host.appendChild(ORB.r.domElement);const w=host.clientWidth||170,h=host.clientHeight||190;ORB.r.setSize(w,h);ORB.cam.aspect=w/h;ORB.cam.updateProjectionMatrix();
    ORB.run=false;ORB.start();
  }catch(e){host.classList.add('orb-fallback');}
}

function readForm(pre,draft,birthOnly){
  syncDraft(pre,draft);const v=draft,name=(v.name||'').trim();
  if(!name){toast('이름을 입력해 주세요.');return null;}
  if(!v.date||v.date.split('-').some(x=>!x)){toast('생년월일을 모두 입력해 주세요.');return null;}
  if(!v.noTime&&!v.time){toast('태어난 시간을 입력하거나 "몰라요"를 선택해 주세요.');return null;}
  if(!birthOnly&&draft.ans.some(a=>!a)){toast('성향 문항 20개에 모두 답해 주세요.');return null;}
  const o={name,cal:v.cal,leap:v.cal==='lunar'&&v.leap,date:v.date,time:v.noTime?'':v.time,gender:v.gender,city:v.city,zishi:v.zishi,timeMode:v.timeMode||'lmt',dstFold:v.dstFold||'earlier',ans:draft.ans.slice()};
  const [y,m,d]=o.date.split('-').map(Number);
  if(y<1900||y>2050){toast('1900년부터 2050년 사이로 입력해 주세요.');return null;}
  if(o.cal!=='lunar'){const t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!==m-1||t.getUTCDate()!==d){toast(`${y}년 ${m}월에는 ${d}일이 없습니다.`);return null;}}
  try{Manse.calc(calcOpts(o));}catch(e){toast(e.message);return null;}
  return o;
}
function syncDraft(pre,d){const g=id=>document.getElementById(pre+'-'+id);if(!g('name'))return;const pad=x=>x?String(x).padStart(2,'0'):'';
  d.name=g('name').value;d.cal=(document.querySelector(`input[name="${pre}-cal"]:checked`)||{}).value||'solar';d.leap=g('leap').checked;
  d.date=`${g('y').value}-${pad(g('m').value)}-${pad(g('d').value)}`;{const ap=g('ap').value,hh=g('hh').value,mi=g('mi').value;d.time=ap&&hh&&mi!==''?`${String((+hh%12)+(ap==='pm'?12:0)).padStart(2,'0')}:${String(mi).padStart(2,'0')}`:'';}d.noTime=g('notime').checked;
  d.gender=(document.querySelector(`input[name="${pre}-g"]:checked`)||{}).value||'M';d.city=g('city').value;d.zishi=g('zishi').value;}

document.addEventListener('click',e=>{const t=e.target.closest('[data-wact],[data-wcity],[data-wgender],[data-wanswer],[data-wcal],[data-wedit]');if(!t||S.screen!=='start'||W.busy)return;
 const d=t.dataset;if(d.wact==='next')wizardNext();if(d.wact==='back')wizardMove(Math.max(0,W.step-1));
 if(d.wact==='notime'){S.draft.noTime=true;S.draft.time='';W.step=3;W.error='';render();}
 if(d.wcal){wizardCapture();S.draft.cal=d.wcal;W.error='';render();}
 if(d.wcity){S.draft.city=d.wcity;W.step=4;W.error='';render();}
 if(d.wgender){S.draft.gender=d.wgender;W.step=5;W.error='';render();}
 if(d.wedit!==undefined)wizardMove(+d.wedit);
 if(d.wanswer){const i=W.step-5;if(i<0||i>=20)return;S.draft.ans[i]=+d.wanswer;W.busy=true;t.classList.add('selected');t.setAttribute('aria-pressed','true');setTimeout(()=>{W.busy=false;if(S.screen==='start'&&W.step===i+5){W.step++;W.error='';render();window.scrollTo(0,0);}},280);}
});
document.addEventListener('keydown',e=>{if(S.screen!=='start'||e.isComposing||e.key!=='Enter')return;if(['w-name','w-day'].includes(e.target.id)){e.preventDefault();wizardNext();}else if(e.target.id==='w-year'){e.preventDefault();document.getElementById('w-month')?.focus();}else if(e.target.id==='w-month'){e.preventDefault();document.getElementById('w-day')?.focus();}});
document.addEventListener('input',e=>{if(S.screen==='start'&&e.target.id==='w-name')S.draft.name=e.target.value.trim();});
document.addEventListener('change',e=>{if(e.target.id==='w-zishi')S.draft.zishi=e.target.value;if(e.target.id==='w-timemode')S.draft.timeMode=e.target.value;if(e.target.id==='w-dstfold')S.draft.dstFold=e.target.value;});
document.addEventListener('change',e=>{
  if(e.target.name==='scope')S.recv.scope=e.target.value;
  if(e.target.id==='agree')S.recv.agree=e.target.checked;
  if(e.target.id==='invagree')S.invAgree=e.target.checked;
  if(e.target.name&&e.target.name.endsWith('-cal')){const pre=e.target.name.split('-')[0],lp=document.getElementById(pre+'-leap');lp.disabled=e.target.value!=='lunar';if(lp.disabled)lp.checked=false;}
  if(e.target.id&&e.target.id.endsWith('-notime')){const pre=e.target.id.split('-')[0];['ap','hh','mi'].forEach(k=>document.getElementById(pre+'-'+k).disabled=e.target.checked);}
});
document.addEventListener('click',async e=>{
  if(S._dragged){S._dragged=false;return;}
  const t=e.target.closest('[data-go],[data-act],[data-cat],[data-pair],[data-inv],[data-plan],[data-filter],[data-ans],[data-tab],[data-hook],[data-del]');
  if(!t){if(e.target.id==='sheet')document.getElementById('sheet').hidden=true;return;}
  const d=t.dataset;
  if(d.ans){const [pre,i,n]=d.ans.split(':');const dr=pre==='me'?S.draft:S.recv.form;dr.ans[+i]=+n;t.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b===t));return;}
  if(d.del!==undefined){S.delAsk=+d.del;render();return;}
  if(d.hook){S.cat=d.hook;S.screen='invite';render();scrollTo(0,0);toast(`관계를 '${CATS[d.hook].k}'(으)로 골라 두었어요.`);return;}
  if(d.tab){S.tab=d.tab;render();return;}
  if(d.go){if(d.go==='map')S.mapVB=null;if((d.go==='invite'||d.go==='map')&&S.me&&!S.demo)refreshNet().then(()=>{if(S.screen===d.go)render();}).catch(()=>{});S.screen=d.go;if(d.go==='recv'&&S.recv.step==='done')S.recv={step:'invite',scope:'all',agree:false,form:null};render();scrollTo(0,0);return;}
  if(d.cat){S.cat=d.cat;render();return;}
  if(d.filter){S.filter=d.filter;S.mapVB=null;render();return;}
  if(d.inv!==undefined){S.pairObj=inviterObj(d.inv);if(S.pairObj){S.screen='pair';render();scrollTo(0,0);}return;}
  if(d.pair!==undefined){S.pairObj=null;S.pair=+d.pair;S.screen='pair';render();scrollTo(0,0);return;}
  if(d.plan){S.plan=Math.max(S.plan,+d.plan);document.getElementById('sheet').hidden=true;toast(d.plan==='1'?'기본 이용권이 적용됐어요. (시뮬레이션)':'확장 이용권이 적용됐어요. (시뮬레이션)');render();return;}
  switch(d.act){
    case 'refreshnet':try{await refreshNet();render();toast('새 인연 확인했어요.');}catch(e){toast('새로고침 실패: '+e.message);}break;
    case 'pay':break;
    case 'close':document.getElementById('sheet').hidden=true;break;
    case 'edit':W.step=0;W.error='';S.step=1;S.draft=(!S.me||S.me.example)?{name:'',date:'',time:'',noTime:false,cal:'solar',gender:'M',city:'서울',zishi:'unified',ans:Array(NQ).fill(0)}:{...S.me,noTime:!S.me.time,ans:S.me.ans.slice()};if(0)S.draft={name:'',date:'',time:'',noTime:false,ans:S.me.example?Array(NQ).fill(0):S.me.ans.slice()};S.screen='start';render();scrollTo(0,0);break;
    case 'next':{const v=readForm('me',S.draft,true);if(!v)break;if(S.invite&&Store.uid!==S.invite.u&&!S.invAgree){toast('초대 동의 항목에 체크해 주세요.');break;}S.step=2;render();scrollTo(0,0);break;}
    case 'prev':syncDraft('me',S.draft);S.step=1;render();scrollTo(0,0);break;
    case 'demo':S.demo=true;S._me=S.me;S._fr=S.friends;S.me=DEMO_ME;S.friends=DEMO_FR;S.net=demoNet();S.mapVB=null;S.screen='me';render();scrollTo(0,0);toast('예시 데이터예요. 저장되지 않습니다.');break;
    case 'restart':W.step=0;W.error='';S.demo=false;S.me=S._me||null;S.friends=S._fr||[];S.net=null;S.screen='start';S.step=1;render();scrollTo(0,0);break;
    case 'copycode':{const t=document.getElementById('mycode');try{await navigator.clipboard.writeText(t.value);toast('내 코드를 복사했어요. 카톡에 붙여 넣어 보내세요.');}catch(_){t.select();toast('코드를 선택했어요. 길게 눌러 복사하세요.');}break;}
    case 'addcode':{const t=document.getElementById('addcode');try{const p=readCode(t.value);if(S.me&&p.name===S.me.name&&p.date===S.me.date){toast('내 코드예요. 지인에게 받은 코드를 넣어 주세요.');break;}
      const dup=S.friends.findIndex(f=>f.name===p.name&&f.date===p.date);const np=person({...p,cat:S.cat,scope:'all'});if(dup>=0)S.friends[dup]=np;else S.friends.push(np);persist();render();toast(dup>=0?`${p.name}님 정보를 새로 고쳤어요.`:`${p.name}님을 추가했어요.`);}catch(e){toast(e.message);}break;}
    case 'delno':S.delAsk=null;render();break;
    case 'delyes':{const f=S.friends[S.delAsk];S.delAsk=null;try{await Store.disconnect(f.uid);delete S.pairs[f.uid];await refreshNet();render();toast('서로의 직접 연결을 끊었어요.');}catch(e){toast('연결 해제 실패: '+e.message);}break;}
    case 'saveme':{if(S.screen==='start'){wizardCapture();if(S.invite&&S.invite.u!==Store.uid&&!S.invAgree){toast('초대 연결 동의를 체크해 주세요.');break;}}if(Store.mode==='error'||Store.mode==='off'){toast('서버 연결을 먼저 확인해 주세요.');break;}const v=S.screen==='start'?(()=>{const o=readForm('me',{...S.draft},true);return o&&!S.draft.ans.some(a=>!a)?{...o,ans:S.draft.ans.slice()}:(o&&toast('성향 문항 20개에 모두 답해 주세요.'),null);})():readForm('me',S.draft);if(!v)break;
      if(S.demo){S.demo=false;S.friends=[];S.net=null;}S.me=person(v);S.revisit=false;await analyzing();S.screen='me';render();scrollTo(0,0);
      try{await Store.saveProfile({...raw(S.me),updatedAt:Date.now()});let linked=false;if(S.invite&&S.invAgree)linked=await linkInviter();await refreshNet();
        if(linked){S.pairObj=inviterObj(S.invite.u);S.screen=S.pairObj?'pair':'me';history.replaceState(null,'',location.href.split('#')[0]);S.invite=null;}
        render();scrollTo(0,0);toast(linked?'초대한 사람과 연결됐어요.':'저장했어요.');}catch(e){console.error(e);toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.');}break;}
    case 'acceptinv':{if(!S.invAgree){toast('초대 동의 항목에 체크해 주세요.');break;}try{await linkInviter();await refreshNet();S.pairObj=inviterObj(S.invite.u);S.screen=S.pairObj?'pair':'me';history.replaceState(null,'',location.href.split('#')[0]);S.invite=null;render();scrollTo(0,0);toast('연결됐어요.');}catch(e){console.error(e);toast('연결하지 못했어요. 잠시 후 다시 해 주세요.');}break;}
    case 'copyinv':{const t=document.getElementById('invmsg');try{await navigator.clipboard.writeText(t.value);toast('초대 메시지를 복사했어요. 카톡에 붙여 넣어 보내세요.');}catch(_){t.select();toast('메시지를 선택했어요. 길게 눌러 복사하세요.');}break;}
    case 'shareinv':{try{await navigator.share({title:'아뜰리에 사주(성수점) · 궁합',text:document.getElementById('invmsg').value});}catch(_){}break;}
    case 'wipe':S.wipeAsk=true;render();break;
    case 'wipeno':S.wipeAsk=false;render();break;
    case 'wipeyes':{try{await Store.wipe();S.wipeAsk=false;S.me=null;S.friends=[];S.net=null;S.pairs={};S.screen='start';W.step=0;S.step=1;render();toast('내 정보와 연결을 삭제했어요.');}catch(e){toast('삭제 실패: '+e.message);}break;}
    case 'copy':{const inp=document.getElementById('lnk');try{await navigator.clipboard.writeText(inp.value);toast('링크를 복사했어요.');}catch(_){inp.select();toast('링크를 선택했어요. 길게 눌러 복사하세요.');}break;}
    case 'send':S.recv={step:'invite',scope:'all',agree:false,form:null};S.screen='recv';render();scrollTo(0,0);break;
    case 'decline':toast(`거절했어요. ${S.me.name}님에게는 "응답하지 않음"으로만 표시됩니다.`);S.screen='invite';render();break;
    case 'recvstart':if(!S.recv.agree){toast('필수 동의 항목에 체크해 주세요.');break;}S.recv.step='form';S.recv.form={name:'',date:'',time:'',noTime:false,cal:'solar',gender:'F',city:'서울',zishi:'unified',ans:Array(NQ).fill(0)};render();scrollTo(0,0);break;
    case 'recvsave':{const v=readForm('rv',S.recv.form);if(!v)break;S.friends.push(person({...v,cat:S.cat,scope:S.recv.scope}));S.recv.step='done';render();scrollTo(0,0);break;}
    case 'newme':toast('응답자도 자기 링크를 만들 수 있어요.');S.screen='me';render();scrollTo(0,0);break;
  }
});
render();boot();
</script>
